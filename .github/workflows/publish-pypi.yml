name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Registry to publish to"
        required: true
        type: choice
        default: pypi
        options:
          - pypi
          - testpypi

# Trusted Publishing via OIDC — no long-lived PyPI token stored in the
# repository. The pending publisher must be configured on PyPI before
# the first successful run (see docs/RELEASE_PROCESS.md).
permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distribution
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Attest artifact provenance (Sigstore)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: dist/
          retention-days: 14

  publish-pypi:
    name: Upload to PyPI
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi') }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/argo-cloud-osint
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: python-distribution
          path: dist/

      - name: Publish to PyPI (Trusted Publisher, no token)
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Upload to TestPyPI (dry-run)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/argo-cloud-osint
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: python-distribution
          path: dist/

      - name: Publish to TestPyPI (Trusted Publisher, no token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
