name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff, blocking)
        run: ruff check osint_bot tests

      - name: Compile
        run: python -m compileall osint_bot

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: JavaScript syntax
        run: node --check osint_bot/web_static/app.js

  ssrf-guard:
    name: SSRF guard (no direct urllib/httpx/requests in connectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce _safe_http gateway
        run: python scripts/enforce_safe_http.py

  build-package:
    name: Build Python package
    runs-on: ubuntu-latest
    needs: [python, ssrf-guard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: pip install --upgrade pip build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distribution
        run: twine check dist/*
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 14

  docker-build:
    name: Docker image build (smoke)
    runs-on: ubuntu-latest
    needs: [python, ssrf-guard]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: argo-cloud-osint-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke run
        run: |
          docker run --rm --entrypoint python argo-cloud-osint-platform:ci -c "import osint_bot; print(osint_bot.__name__, 'ok')"

  # ─── web-next is frozen (experimental / not shipped) ──────────────────────
  # See web-next/STATUS.md. We still typecheck + build it to catch upstream
  # regressions in Next.js and to keep dependency alerts actionable, but the
  # job is BLOCKING now that the lockfile is committed: silent breakage here
  # is a real signal, not noise.
  web-next:
    name: Next.js typecheck + build (frozen prototype)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-next/package-lock.json

      - name: Install
        working-directory: web-next
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: web-next
        run: npm run typecheck

      - name: Build
        working-directory: web-next
        run: npm run build
