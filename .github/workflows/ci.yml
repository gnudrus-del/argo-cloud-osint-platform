name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e .
      - name: Python compile
        run: python -m compileall osint_bot
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: JavaScript syntax
        run: node --check osint_bot/web_static/app.js
