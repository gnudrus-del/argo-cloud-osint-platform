name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (leave empty to derive from git tag)"
        required: false

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image name + tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="edge"
          fi
          VERSION_NO_V="${VERSION#v}"
          {
            echo "image=$IMAGE"
            echo "tags=$IMAGE:$VERSION_NO_V,$IMAGE:latest"
            echo "version=$VERSION_NO_V"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Argo Cloud OSINT Platform
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ─── Sigstore attestation (SLSA v1 build provenance) ──────────────────
      # After push, the runner asks Sigstore's Fulcio to co-sign a statement
      # binding the image digest to *this* workflow run. Anyone can later
      # verify with:
      #     gh attestation verify \
      #         oci://ghcr.io/gnudrus-del/argo-cloud-osint-platform:0.1.0 \
      #         --repo gnudrus-del/argo-cloud-osint-platform
      - name: Attest image (Sigstore build provenance)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
