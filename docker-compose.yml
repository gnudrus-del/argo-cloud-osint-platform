services:
  # Postgres è il backend raccomandato per un deploy in produzione/multi-analista
  # (vedi docs/CONFIGURATION.md — SQLite resta il default a zero configurazione
  # per uso singolo-analista/valutazione). Per restare su SQLite: commenta questo
  # servizio, rimuovi DATABASE_URL dal servizio argo-osint sotto, e rimuovi
  # 'depends_on'.
  postgres:
    image: postgres:16-alpine
    container_name: argo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-argo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD before starting}
      POSTGRES_DB: ${POSTGRES_DB:-argo}
    volumes:
      - argo_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-argo} -d ${POSTGRES_DB:-argo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  argo-osint:
    build: .
    image: argo-cloud-osint-platform:local
    container_name: argo-osint
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      OSINT_WEB_TOKEN: ${OSINT_WEB_TOKEN:?set OSINT_WEB_TOKEN before starting}
      OSINT_SIGNUPS_ENABLED: ${OSINT_SIGNUPS_ENABLED:-0}
      OSINT_SECURE_COOKIE: ${OSINT_SECURE_COOKIE:-0}
      OSINT_HSTS: ${OSINT_HSTS:-0}
      OSINT_SESSION_TTL_SECONDS: ${OSINT_SESSION_TTL_SECONDS:-28800}
      DATABASE_URL: postgresql://${POSTGRES_USER:-argo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-argo}
      BING_SEARCH_API_KEY: ${BING_SEARCH_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      CENSYS_API_ID: ${CENSYS_API_ID:-}
      CENSYS_API_SECRET: ${CENSYS_API_SECRET:-}
      HIBP_API_KEY: ${HIBP_API_KEY:-}
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      # Empty = the "Request RFC3161 timestamp" button stays hidden (404 on the
      # endpoint) — same "absent unless configured" pattern as every BYOK key
      # above. Set to a TSA you are authorized to use, e.g. https://freetsa.org/tsr
      # — see docs/CONFIGURATION.md.
      TSA_URL: ${TSA_URL:-}
    volumes:
      - argo_jobs:/app/web_jobs
      - argo_reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/dashboard', timeout=3).status in (200,401) else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Console Next.js sperimentale/frozen — NON il frontend di produzione (che è
  # argo-osint sopra, servito dal backend Python). Opt-in: non parte con un
  # semplice `docker compose up`, serve `docker compose --profile web-next up`.
  # Vedi web-next/STATUS.md per lo stato e la decisione #H4 (completare o
  # eliminare) ancora aperta.
  web-next:
    build: ./web-next
    image: argo-web-next:local
    container_name: argo-web-next
    profiles: ["web-next"]
    depends_on:
      argo-osint:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # Il proxy Next (/api/* -> ARGO_API_BASE, vedi next.config.mjs) deve
      # puntare al servizio del backend Python sulla rete Compose interna.
      ARGO_API_BASE: http://argo-osint:8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  argo_jobs:
  argo_reports:
  argo_postgres_data:
