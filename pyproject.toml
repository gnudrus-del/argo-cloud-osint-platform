[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argo-cloud-osint"
version = "0.2.0"
description = "Self-hosted defensive OSINT platform with CLI + web UI, BYOK connectors, audit chain, and STIX/MISP/PDF/JSON/Markdown exports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Argo Cloud OSINT Platform contributors" }]
maintainers = [{ name = "Argo Cloud OSINT Platform contributors" }]
keywords = [
    "osint",
    "threat-intelligence",
    "defensive-osint",
    "self-hosted",
    "investigation",
    "stix",
    "misp",
    "privacy-by-design",
    "cyber-security",
    "digital-forensics",
    "socmint",
    "recon",
    "gdpr",
    "python",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "reportlab>=4.0",
    "phonenumbers>=8.13",
    "cryptography>=41.0",
    "asn1crypto>=1.5",
]

[project.optional-dependencies]
web = []
ai = [
    "pytesseract>=0.3.10",
    "Pillow>=12.3.0",  # 12.2.0 ha 5 CVE note (PYSEC-2026-2253..2257), corrette in 12.3.0
    "spacy>=3.7",
    "langdetect>=1.0.9",
    "deep-translator>=1.11",
]
postgres = [
    "psycopg[binary]>=3.1",
]
auth = [
    "google-auth>=2.35",
    "requests>=2.31",
]
queue = [
    "celery>=5.3",
    "redis>=5.0",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "build>=1.0",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/gnudrus-del/argo-cloud-osint-platform"
Documentation = "https://github.com/gnudrus-del/argo-cloud-osint-platform/tree/main/docs"
Repository = "https://github.com/gnudrus-del/argo-cloud-osint-platform"
Issues = "https://github.com/gnudrus-del/argo-cloud-osint-platform/issues"
Changelog = "https://github.com/gnudrus-del/argo-cloud-osint-platform/blob/main/CHANGELOG.md"
Security = "https://github.com/gnudrus-del/argo-cloud-osint-platform/security/policy"

[project.scripts]
argo-osint = "osint_bot.cli:main"
osint-bot = "osint_bot.cli:main"
argo-verify-report = "osint_bot.cli_verify:main"
argo-rotate-master-key = "osint_bot.cli_rotate_key:main"
argo-rotate-signing-key = "osint_bot.cli_rotate_signing_key:main"

[tool.setuptools]
packages = ["osint_bot"]

[tool.setuptools.package-data]
osint_bot = ["web_static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["web-next", "tools", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Legacy stylistic rules relaxed pending an incremental cleanup; the
# substantive checks (F821 undefined names, F841 unused vars, B904
# raise-without-from, B905 zip-strict) stay enforced.
ignore = [
    "E501",  # line too long — handled by formatter, not linter
    "E402",  # module-level import not at top — used for optional deps
    "E701",  # multiple statements on one line (colon) — legacy code
    "E702",  # multiple statements on one line (semicolon) — legacy code
    "E741",  # ambiguous variable name (l, I, O) — legacy code
    "UP031", # printf-style string formatting — legacy code
    "B007",  # unused loop control variable — legacy code
]

[tool.ruff.lint.per-file-ignores]
# Tests exercise many edge cases and pull in optional deps.
"tests/*" = ["F841"]
# Legacy connectors / analysis modules with F841 unused-variable debt;
# tracked for cleanup in the same milestone as the SSRF migration.
"osint_bot/connectors/abuseipdb.py" = ["F841"]
"osint_bot/contact_discovery.py" = ["F841"]
"osint_bot/link_analysis.py" = ["F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
